<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>KLK Studio · Vista previa</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#fff;background:#0b0b13}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:520px;margin:auto;min-height:100dvh;background:#12121d;padding:18px}.top{display:flex;align-items:center;justify-content:space-between}.logo{font-size:23px;font-weight:800}.logo span{color:#b694ff}.pill{background:#2d2345;border:1px solid #69538f;color:#e9ddff;padding:8px 12px;border-radius:30px}.preview{position:relative;margin:20px auto 14px;aspect-ratio:9/13;max-height:52dvh;overflow:hidden;border-radius:25px;background:radial-gradient(circle at 75% 25%,#7047aa,#252043 48%,#101018 90%);display:grid;place-items:center;text-align:center}.preview video{width:100%;height:100%;object-fit:contain;position:absolute;inset:0}.empty{padding:30px;z-index:1;pointer-events:none}.empty strong{display:block;font-size:23px}.overlay{position:absolute;left:16px;bottom:18px;text-align:left;text-shadow:0 2px 8px #000;z-index:2;max-width:85%;white-space:pre-wrap;overflow-wrap:anywhere}.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.tool{border:1px solid #343248;border-radius:15px;background:#242334;color:white;padding:12px 4px;min-height:72px}.tool b{display:block;font-size:23px;margin-bottom:5px}.tool[aria-pressed=true]{border-color:#b694ff;background:#44315e}.panel{margin-top:15px;background:#20202f;border-radius:18px;padding:15px}.panel label{display:block;font-size:13px;color:#c9c4d8;margin-bottom:7px}.panel input,.panel select{width:100%;padding:12px;border-radius:12px;border:1px solid #514b66;background:#131320;color:white}.actions{display:flex;gap:10px;margin-top:14px}.actions button{flex:1;padding:13px;border:0;border-radius:14px;color:white;background:#393348}.actions .primary{background:#8756db}.note{font-size:12px;color:#b9b4c9;line-height:1.5}.hidden{display:none}.stats{display:flex;justify-content:space-around;text-align:center}.stats strong{display:block;font-size:23px}.stats small{color:#bdb4cf}
</style></head><body><main class="app">
<header class="top"><div class="logo">KLK <span>Studio</span> 🦁</div><span class="pill">Vista previa independiente</span></header>
<div class="preview" id="preview"><div class="empty" id="empty"><strong>Tu creatividad empieza aquí</strong><p>Selecciona un video de tu teléfono para editarlo.</p></div><video id="video" controls playsinline class="hidden"></video><div class="overlay" id="overlay"></div></div>
<div class="tools">
<button class="tool" data-tab="video" aria-pressed="true"><b>🎬</b>Video</button>
<button class="tool" data-tab="text"><b>✍️</b>Texto</button>
<button class="tool" data-tab="filter"><b>✨</b>Filtros</button>
<button class="tool" data-tab="audio"><b>🎵</b>Audio</button>
<button class="tool" data-tab="trim"><b>✂️</b>Recorte</button>
<button class="tool" data-tab="captions"><b>💬</b>Subtítulos</button>
<button class="tool" data-tab="stats"><b>📊</b>Datos</button>
<button class="tool" data-tab="publish"><b>🚀</b>Publicar</button>
</div>
<section class="panel" id="panel" aria-live="polite"></section>
<p class="note">Prototipo local: no sube videos ni accede a los chats o contactos de KLK. Las funciones no implementadas se indican como próximas.</p>
</main>
<script>
const panel=document.getElementById('panel'),video=document.getElementById('video'),overlay=document.getElementById('overlay');let url=null,musicUrl=null;let musicLibrary=[];const favorites=new Set();const music=new Audio();music.preload='auto';music.loop=true;music.volume=.7;video.volume=.5;const syncMusic=()=>{if(!music.src)return;const t=video.currentTime%(Number.isFinite(music.duration)&&music.duration>0?music.duration:Infinity);if(Number.isFinite(t)&&Math.abs(music.currentTime-t)>.4)music.currentTime=t;};video.addEventListener('play',()=>{syncMusic();if(music.src)music.play().catch(()=>{});});video.addEventListener('pause',()=>music.pause());video.addEventListener('seeked',syncMusic);video.addEventListener('ended',()=>music.pause());
const views={
video:'<label for="file">Elegir video de tu dispositivo</label><input id="file" type="file" accept="video/*"><p class="note">La vista previa se reproduce en este dispositivo.</p>',
text:'<label for="caption">Texto sobre el video</label><input id="caption" maxlength="120" placeholder="Escribe tu mensaje..."><p class="note">El texto aparece en la vista previa; aún no se exporta al archivo.</p>',
filter:'<label for="filter">Filtro de vista previa</label><select id="filter"><option value="none">Original</option><option value="grayscale(1)">Blanco y negro</option><option value="sepia(1)">Vintage</option><option value="contrast(1.4) saturate(1.3)">Vibrante</option></select><p class="note">Los filtros afectan solo a la vista previa.</p>',
audio:'<label for="musicFile">Añadir canciones propias a tu biblioteca</label><input id="musicFile" type="file" accept="audio/*" multiple><label for="musicSearch">Buscar por canción, artista o género</label><input id="musicSearch" type="search" placeholder="Buscar música..."><label for="genre">Explorar género</label><select id="genre"><option value="">Todos los géneros</option><option>Dembow</option><option>Reguetón</option><option>Bachata</option><option>Merengue</option><option>Romántica</option><option>Otro</option></select><label><input id="onlyFavorites" type="checkbox" style="width:auto"> Solo favoritos</label><div id="musicResults" aria-live="polite"></div><p id="musicName" class="note">Ninguna canción seleccionada</p><label for="musicVolume">Volumen de música</label><input id="musicVolume" type="range" min="0" max="100" value="70"><label for="videoVolume">Volumen original del video</label><input id="videoVolume" type="range" min="0" max="100" value="50"><div class="actions"><button id="removeMusic">Quitar música</button></div><p class="note">Biblioteca local temporal: añade archivos de audio que tengas permiso de utilizar. No incluye canciones comerciales ni búsqueda en internet. La mezcla es solo para vista previa; aún no se exporta al video.</p>',
trim:'<strong>✂️ Recortar clips</strong><p class="note">Próximamente: línea de tiempo, división y exportación de clips.</p>',
captions:'<strong>💬 Subtítulos automáticos</strong><p class="note">Próximamente: transcripción, edición y sincronización.</p>',
stats:'<div class="stats"><div><strong>—</strong><small>Vistas</small></div><div><strong>—</strong><small>Me gusta</small></div><div><strong>—</strong><small>Seguidores</small></div></div><p class="note">Sin datos reales hasta que exista publicación.</p>',
publish:'<strong>🚀 Publicación</strong><p class="note">Desactivada en esta vista previa para proteger la aplicación principal. Se habilitará tras integrar autenticación, almacenamiento, moderación y privacidad.</p>'
};
function show(tab){panel.innerHTML=views[tab];document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.tab===tab)));if(tab==='file')return;
if(tab==='video')document.getElementById('file').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(f);video.src=url;video.classList.remove('hidden');document.getElementById('empty').classList.add('hidden');video.play().catch(()=>{});});
if(tab==='text'){const input=document.getElementById('caption');input.value=overlay.textContent;input.addEventListener('input',()=>overlay.textContent=input.value);}
if(tab==='audio'){
const f=document.getElementById('musicFile'),n=document.getElementById('musicName'),results=document.getElementById('musicResults'),search=document.getElementById('musicSearch'),genre=document.getElementById('genre'),onlyFav=document.getElementById('onlyFavorites');
n.textContent=musicUrl?'Música seleccionada':'Ninguna canción seleccionada';
document.getElementById('musicVolume').value=Math.round(music.volume*100);document.getElementById('videoVolume').value=Math.round(video.volume*100);
function render(){
results.replaceChildren();
const q=search.value.trim().toLocaleLowerCase();
const items=musicLibrary.filter(x=>(!q||(x.title+' '+x.artist+' '+x.genre).toLocaleLowerCase().includes(q))&&(!genre.value||x.genre===genre.value)&&(!onlyFav.checked||favorites.has(x.id)));
if(!items.length){const p=document.createElement('p');p.className='note';p.textContent='No hay canciones que coincidan. Añade música de tu dispositivo.';results.append(p);return;}
for(const item of items){
const row=document.createElement('div');row.style.cssText='display:flex;gap:6px;align-items:center;margin:8px 0;padding:8px;background:#171725;border-radius:12px';
const title=document.createElement('span');title.style.cssText='flex:1;min-width:0;overflow-wrap:anywhere;font-size:13px';title.textContent=item.title+' · '+item.artist+' · '+item.genre;
const play=document.createElement('button');play.textContent='▶ Usar';play.className='pill';play.onclick=()=>{music.pause();musicUrl=item.url;music.src=item.url;n.textContent='Seleccionada: '+item.title;if(!video.paused){syncMusic();music.play().catch(()=>{});}else{music.currentTime=0;music.play().catch(()=>{});}};
const fav=document.createElement('button');fav.className='pill';fav.textContent=favorites.has(item.id)?'♥':'♡';fav.setAttribute('aria-label','Alternar favorito');fav.onclick=()=>{favorites.has(item.id)?favorites.delete(item.id):favorites.add(item.id);render();};
row.append(title,play,fav);results.append(row);
}}
f.addEventListener('change',e=>{for(const file of e.target.files){if(!file.type.startsWith('audio/'))continue;const title=file.name.replace(/\.[^.]+$/,'');const parts=title.split(' - ');musicLibrary.push({id:crypto.randomUUID(),title:parts.length>1?parts.slice(1).join(' - '):title,artist:parts.length>1?parts[0]:'Archivo local',genre:'Otro',url:URL.createObjectURL(file)});}f.value='';render();});
search.addEventListener('input',render);genre.addEventListener('change',render);onlyFav.addEventListener('change',render);
document.getElementById('musicVolume').addEventListener('input',e=>music.volume=Number(e.target.value)/100);
document.getElementById('videoVolume').addEventListener('input',e=>video.volume=Number(e.target.value)/100);
document.getElementById('removeMusic').addEventListener('click',()=>{music.pause();music.removeAttribute('src');music.load();musicUrl=null;n.textContent='Ninguna canción seleccionada';});
render();
}
if(tab==='filter'){const select=document.getElementById('filter');select.value=video.style.filter||'none';select.addEventListener('change',()=>video.style.filter=select.value);}
}
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>show(b.dataset.tab)));show('video');
</script></body></html>
