<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#a78bdb"><title>KLK Momentos</title><style>*{box-sizing:border-box}body{margin:0;background:#f8f5fc;color:#302243;font:16px system-ui,Arial}header{padding:18px;background:#fff;display:flex;align-items:center;gap:12px;box-shadow:0 1px 8px #0001}header a{color:#6f48ad;text-decoration:none;font-weight:700}h1{font-size:24px;margin:0}main{max-width:720px;margin:auto;padding:18px}.panel{background:white;border-radius:22px;padding:18px;margin-bottom:18px;box-shadow:0 3px 18px #35204b12}label{display:block;font-weight:600;margin:12px 0 6px}input,textarea{width:100%;font:inherit;border:1px solid #ded5e9;border-radius:12px;padding:12px;background:#fff}textarea{min-height:75px;resize:vertical}button{border:0;border-radius:14px;background:#9470c7;color:white;font:inherit;font-weight:700;padding:12px 18px;cursor:pointer}button:disabled{opacity:.5}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.memory{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 2px 10px #0001}.memory img,.memory video{display:block;width:100%;max-height:280px;object-fit:cover}.memory .detail{padding:12px;overflow-wrap:anywhere}.memory time{color:#756782;font-size:12px}.memory p{white-space:pre-wrap}.memory button{background:#fce8ef;color:#9c3053;font-size:13px;padding:8px 12px}.hint{color:#71677d;font-size:13px;line-height:1.5}#message{min-height:24px;color:#6843a4}#empty{padding:24px;text-align:center;color:#71677d}</style></head><body><header><a href="./">← KLK</a><h1>💜 KLK Momentos</h1></header><main><div class="panel"><h2>Crear recuerdo</h2><p class="hint">Galería privada de este dispositivo. Los archivos no se envían a otros usuarios ni se sincronizan con tu cuenta. No borres los datos del navegador si quieres conservarlos.</p><form id="form"><label for="photo">Foto o video</label><input id="photo" type="file" accept="image/*,video/*" required><label for="note">Descripción (opcional)</label><textarea id="note" maxlength="500" placeholder="¿Qué quieres recordar?"></textarea><button id="save" type="submit">Guardar recuerdo</button></form><p id="message" role="status" aria-live="polite"></p></div><h2>Mis recuerdos</h2><div id="empty" class="panel" hidden>Todavía no tienes recuerdos guardados.</div><div id="gallery" class="grid"></div></main><script>
const $=id=>document.getElementById(id);let db;const open=indexedDB.open('klk-momentos-local',1);open.onupgradeneeded=()=>{const d=open.result;if(!d.objectStoreNames.contains('memories'))d.createObjectStore('memories',{keyPath:'id',autoIncrement:true})};open.onerror=()=>{$('message').textContent='No se pudo abrir el almacenamiento privado del navegador.'};open.onsuccess=()=>{db=open.result;render()};function store(mode){return db.transaction('memories',mode).objectStore('memories')}function render(){if(!db)return;const q=store('readonly').getAll();q.onsuccess=()=>{const root=$('gallery');root.replaceChildren();const memories=q.result.sort((a,b)=>b.id-a.id);$('empty').hidden=memories.length>0;for(const m of memories){const card=document.createElement('article');card.className='memory';if(m.file){const url=URL.createObjectURL(m.file);const media=document.createElement(m.file.type.startsWith('video/')?'video':'img');media.src=url;if(media.tagName==='VIDEO')media.controls=true;media.addEventListener('load',()=>{if(media.tagName==='IMG')URL.revokeObjectURL(url)},{once:true});card.append(media)}const detail=document.createElement('div');detail.className='detail';const date=document.createElement('time');date.textContent=new Date(m.createdAt).toLocaleString('es-DO');detail.append(date);if(m.note){const p=document.createElement('p');p.textContent=m.note;detail.append(p)}const del=document.createElement('button');del.textContent='Eliminar';del.onclick=()=>{if(!confirm('¿Eliminar este recuerdo de este dispositivo?'))return;const req=store('readwrite').delete(m.id);req.onsuccess=render;req.onerror=()=>alert('No se pudo eliminar')};detail.append(del);card.append(detail);root.append(card)}};q.onerror=()=>{$('message').textContent='No se pudieron cargar los recuerdos.'}}$('form').onsubmit=e=>{e.preventDefault();if(!db)return;const file=$('photo').files[0];if(!file||!(file.type.startsWith('image/')||file.type.startsWith('video/'))){$('message').textContent='Selecciona una foto o video válido.';return}if(file.size>20*1024*1024){$('message').textContent='El archivo debe pesar como máximo 20 MB.';return}$('save').disabled=true;const q=store('readwrite').add({file,note:$('note').value.trim(),createdAt:Date.now()});q.onsuccess=()=>{$('form').reset();$('message').textContent='Recuerdo guardado en este dispositivo.';$('save').disabled=false;render()};q.onerror=()=>{$('message').textContent='No se pudo guardar. Revisa el espacio disponible.';$('save').disabled=false}};</script></body></html>
