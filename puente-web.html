<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KLK Puente Web</title><style>body{font:16px system-ui;max-width:560px;margin:auto;padding:20px;background:#f5f2fa;color:#211b2b}button,input,textarea{font:inherit;padding:12px;margin:5px 0;border-radius:12px;border:1px solid #bbb;box-sizing:border-box}button{background:#7043a4;color:white;border:0}textarea,input{width:100%}#log{white-space:pre-wrap;overflow-wrap:anywhere;background:white;padding:16px;min-height:120px;border-radius:12px}</style><h1>KLK Puente · Web</h1><p>Abre esta página en ambos teléfonos antes de desconectar internet. Mantén Wi-Fi local activo. Intercambia los códigos manualmente.</p><p id="state">Sin conexión directa</p><button id="offer">1. Crear invitación</button> <button id="answer">2. Responder invitación</button> <button id="finish">3. Confirmar respuesta</button><textarea id="remote" placeholder="Pega el código del otro teléfono"></textarea><textarea id="local" readonly placeholder="Tu código aparecerá aquí"></textarea><button id="copy">Copiar código</button><div id="log"></div><input id="msg" placeholder="Mensaje"><button id="send" disabled>Enviar</button><script>
const $=id=>document.getElementById(id);let pc,dc;const state=s=>$('state').textContent=s;function log(s){$('log').textContent+=s+'\n'}function bind(c){dc=c;c.onopen=()=>{state('Conectado directamente');$('send').disabled=false};c.onclose=()=>{state('Desconectado');$('send').disabled=true};c.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.ack){log('Entregado: '+m.ack);return}if(typeof m.text!=='string'||typeof m.id!=='string')return;const k='klk-web-inbox-'+m.id;if(!localStorage.getItem(k)){localStorage.setItem(k,m.text);log('Contacto: '+m.text)}c.send(JSON.stringify({ack:m.id}));}catch(e){state('Error al recibir: '+e.message)}}}
function init(){if(pc)pc.close();pc=new RTCPeerConnection({iceServers:[]});pc.ondatachannel=e=>bind(e.channel);pc.onconnectionstatechange=()=>{state(pc.connectionState);if(pc.connectionState!=='connected')$('send').disabled=true};}
async function exportCode(){if(pc.iceGatheringState!=='complete')await new Promise((resolve,reject)=>{let t=setTimeout(()=>reject(Error('No se completó la búsqueda de red')),20000);pc.addEventListener('icegatheringstatechange',()=>{if(pc.iceGatheringState==='complete'){clearTimeout(t);resolve()}})});$('local').value=JSON.stringify(pc.localDescription);}
function action(id,fn){$(id).onclick=async()=>{try{await fn()}catch(e){state('Error: '+e.message)}}}
action('offer',async()=>{init();bind(pc.createDataChannel('klk'));await pc.setLocalDescription(await pc.createOffer());await exportCode()});
action('answer',async()=>{init();await pc.setRemoteDescription(JSON.parse($('remote').value));await pc.setLocalDescription(await pc.createAnswer());await exportCode()});
action('finish',async()=>{await pc.setRemoteDescription(JSON.parse($('remote').value))});
action('copy',async()=>{await navigator.clipboard.writeText($('local').value)});
action('send',async()=>{let text=$('msg').value.trim();if(!text||dc?.readyState!=='open')return;let id=crypto.randomUUID();localStorage.setItem('klk-web-outbox-'+id,text);dc.send(JSON.stringify({id,text}));log('Tú: '+text+' · pendiente ('+id+')');$('msg').value=''});
</script></html>
