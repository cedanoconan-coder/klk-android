<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KLK · Administración de registros</title><style>body{font:16px system-ui,sans-serif;background:#f3f5f4;color:#172923;margin:0}main{max-width:760px;margin:auto;padding:20px}h1{font-size:24px}button,a{cursor:pointer}button{border:0;border-radius:12px;padding:12px;background:#075e54;color:white}.card{background:white;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0001}small{color:#566}article{border-top:1px solid #ddd;padding:12px 0;overflow-wrap:anywhere}.error{color:#a22}</style></head><body><main><a href="./">← Volver a KLK</a><h1>Administración · Usuarios registrados</h1><p>Panel privado de perfiles activados. Las cuentas pendientes de verificación solo aparecen en Firebase Authentication.</p><section class="card"><p id="status">Comprobando sesión…</p><button id="refresh" hidden>Actualizar lista</button><div id="results"></div></section></main><script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script><script>
const ADMIN_UID="BMJ63X7P9oSvv9NuxtNogZ20FIH2";
firebase.initializeApp({apiKey:"AIzaSyAgMkDOS77y-jHnzCEteQW1UgC90gShjuU",authDomain:"klk-familia.firebaseapp.com",projectId:"klk-familia",appId:"1:184754934059:web:1d385677b2c7c00699b56e"});
const auth=firebase.auth(),db=firebase.firestore(),status=document.getElementById("status"),results=document.getElementById("results"),refresh=document.getElementById("refresh");
const format=t=>t?.toDate?new Intl.DateTimeFormat("es-DO",{dateStyle:"medium",timeStyle:"short"}).format(t.toDate()):"No disponible";
function field(parent,label,value){const p=document.createElement("p");const b=document.createElement("strong");b.textContent=label+": ";p.append(b,document.createTextNode(value||"No disponible"));parent.append(p)}
async function load(){status.textContent="Consultando perfiles activados…";results.replaceChildren();refresh.disabled=true;try{const snapshot=await db.collection("users").limit(500).get({source:"server"});status.textContent=snapshot.size+" perfiles activados"+(snapshot.size===500?" (primeros 500)":"");snapshot.forEach(doc=>{const d=doc.data(),item=document.createElement("article");field(item,"Nombre",d.displayName);field(item,"Correo",d.email);field(item,"UID",doc.id);field(item,"Invitado por",d.invitedBy);field(item,"Última actualización del perfil",format(d.updatedAt));results.append(item)});}catch(e){status.textContent="No se pudo consultar: "+e.message;status.className="error"}finally{refresh.disabled=false}}
auth.onAuthStateChanged(user=>{if(!user){status.textContent="Inicia sesión primero en KLK y vuelve a abrir este panel.";return}if(user.uid!==ADMIN_UID){status.textContent="Acceso restringido al administrador.";return}refresh.hidden=false;load()});refresh.addEventListener("click",load);
</script></body></html>
