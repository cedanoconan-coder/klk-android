<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#075e54">
<meta name="description" content="Chat privado para mantener a la familia conectada.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>klk - Chat familiar</title>
<style>
*{box-sizing:border-box}html{min-height:100%;background:#efeae2}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#efeae2;color:#111b21;min-height:100vh;min-height:100dvh;padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;background:#075e54;color:white;padding:calc(14px + env(safe-area-inset-top)) 18px 14px;font-size:25px;font-weight:700;box-shadow:0 2px 5px #0002}
header small{display:block;font-size:13px;font-weight:400;opacity:.9;margin-top:3px}
main{max-width:760px;margin:auto;padding:12px 10px calc(12px + env(safe-area-inset-bottom))}.card{background:#fff;padding:20px;border-radius:12px;margin-top:16px;box-shadow:0 2px 8px #00000012}
h2{margin-top:0}input,button{width:100%;padding:14px;margin:7px 0;border-radius:24px;font-size:16px}
input{border:1px solid #d6dce0;background:#fff;color:#17211e}input:focus{outline:2px solid #128c7e;border-color:transparent}
button{background:#075e54;color:white;border:0;font-weight:700;cursor:pointer}button.secondary{background:#e3f2ed;color:#075e54}button:disabled{opacity:.55}
#chat{display:none;padding:0;overflow:hidden;background:#efeae2}
.chatTop{background:#075e54;color:#fff;padding:14px 16px}.chatTop h2{font-size:18px;margin:0 0 3px}.chatTop .muted{color:#d6eee8}
#messages{height:58vh;height:58dvh;max-height:650px;min-height:260px;overflow:auto;padding:14px 12px;background-color:#efeae2;background-image:radial-gradient(#d8d0c5 0.7px,transparent 0.7px);background-size:18px 18px}
.msg{background:#fff;padding:9px 12px;border-radius:3px 12px 12px 12px;margin:8px 0;overflow-wrap:anywhere;max-width:88%;width:fit-content;box-shadow:0 1px 1px #00000012}
.msg.mine{background:#d9fdd3;margin-left:auto;border-radius:12px 3px 12px 12px}
.msg b{font-size:12px;color:#087568}.msg p{margin:5px 0 0;white-space:pre-wrap;font-size:15px;line-height:1.35}
#messages img{display:block;max-width:100%;max-height:340px;border-radius:8px;margin-top:7px}#messages audio{display:block;width:min(260px,70vw);max-width:100%;margin-top:7px}
.composer{display:flex;align-items:center;gap:7px;padding:9px;background:#f0f2f5}
.composer input{flex:1;min-width:0;margin:0;border:0;border-radius:24px;padding:13px 16px;background:#fff}
.iconBtn{width:44px;height:44px;flex:0 0 44px;margin:0;padding:0;border-radius:50%;font-size:20px;background:#fff;color:#54656f}
#send{width:46px;height:46px;flex:0 0 46px;margin:0;padding:0;border-radius:50%;font-size:18px}
#mediaActions{display:flex;gap:7px;padding:0 12px 8px;background:#f0f2f5}#mediaActions button{width:auto;flex:1;margin:0;padding:9px 5px;border-radius:20px;font-size:13px}
#recordStatus{padding:0 12px;margin:0;background:#f0f2f5;min-height:18px}.chatFoot{padding:4px 12px 10px;background:#f0f2f5}
.muted{color:#68736f;font-size:12px}#status{color:#a12b2b;overflow-wrap:anywhere;min-height:18px}.hint{font-size:13px;color:#68736f;line-height:1.45}button[hidden]{display:none!important}#installApp{margin-top:0}
@media(max-width:420px){main{padding:8px 0}.card{border-radius:0;margin-top:8px}#chat{margin-top:0}#messages{height:calc(100dvh - 220px);max-height:none}}
</style>
</head>
<body>
<header>klk <small>Tu familia, siempre conectada ❤️</small></header>
<main>
<button id="installApp" class="secondary" type="button" hidden>Instalar klk en este teléfono</button>
<section id="login" class="card">
<h2>Bienvenido a klk</h2><p>Entra o crea tu cuenta familiar.</p>
<form id="authForm">
<input id="email" type="email" autocomplete="email" placeholder="Correo electrónico" required>
<input id="password" type="password" autocomplete="current-password" placeholder="Contraseña (mínimo 6 caracteres)" minlength="6" required>
<button id="enter" type="submit">Iniciar sesión</button>
</form>
<button id="register" class="secondary" type="button">Crear cuenta</button>
<button id="forgot" class="secondary" type="button">Olvidé mi contraseña</button>
<p id="status" role="status" aria-live="polite"></p>
<p class="hint">Necesitas conexión a internet para iniciar sesión y enviar mensajes.</p>
</section>
<section id="chat" class="card">
<div class="chatTop"><h2>👨‍👩‍👧‍👦 Familia klk</h2><p id="who" class="muted"></p></div>
<div id="messages" aria-live="polite"><p class="muted">Cargando mensajes...</p></div>
<div class="composer">
 <button id="pickPhoto" class="iconBtn" type="button" aria-label="Elegir foto" title="Elegir foto">＋</button>
 <input id="message" maxlength="2000" placeholder="Escribe un mensaje" autocomplete="off" aria-label="Escribe un mensaje">
 <button id="send" type="button" aria-label="Enviar mensaje" title="Enviar">➤</button>
</div>
<div id="mediaActions">
 <button id="takePhoto" type="button">📷 Cámara</button>
 <button id="recordAudio" type="button">🎙️ Grabar audio</button>
 <button id="sendAudio" type="button" disabled>Enviar audio</button>
</div>
<input id="galleryInput" type="file" accept="image/*" hidden>
<input id="cameraInput" type="file" accept="image/*" capture="environment" hidden>
<p id="recordStatus" class="hint" role="status" aria-live="polite"></p>
<div class="chatFoot"><p id="chatStatus" class="hint" role="status" aria-live="polite"></p><button id="logout" class="secondary" type="button">Cerrar sesión</button></div>
</section>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const firebaseConfig = {
 apiKey: "AIzaSyAgMkDOS77y-jHnzCEteQW1UgC90gShjuU",
 authDomain: "klk-familia.firebaseapp.com",
 projectId: "klk-familia",
 storageBucket: "klk-familia.firebasestorage.app",
 messagingSenderId: "184754934059",
 appId: "1:184754934059:web:1d385677b2c7c00699b56e",
 measurementId: "G-DXX2PHDNN0"
};
const $ = id => document.getElementById(id);
const SUPABASE_URL = "https://nrnqzzhhvjramxkahkqs.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "PEGA_AQUI_LA_CLAVE_PUBLICABLE";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
const mediaUrlCache = new Map();
let auth, db, unsubscribe = null, sending = false, mediaRecorder = null, audioStream = null, audioBlob = null, audioStartedAt = 0;
function showError(target, error) {
 console.error("Error de klk/Firebase:", error);
 const messages = {
  "auth/email-already-in-use":"Este correo ya tiene una cuenta.",
  "auth/invalid-email":"El correo electrónico no es válido.",
  "auth/weak-password":"La contraseña debe tener al menos 6 caracteres.",
  "auth/user-not-found":"No existe una cuenta con ese correo.",
  "auth/wrong-password":"La contraseña es incorrecta.",
  "auth/invalid-credential":"El correo o la contraseña son incorrectos.",
  "auth/network-request-failed":"Firebase no respondió a la solicitud. Comprueba la conexión, la fecha y hora automáticas del teléfono y que no haya un DNS privado o bloqueador filtrando Google.",
  "auth/unauthorized-domain":"Firebase no autorizó el dominio de esta aplicación. Hay que corregir los dominios autorizados del proyecto.",
  "auth/operation-not-allowed":"El inicio de sesión por correo y contraseña no está activado en Firebase.",
  "auth/api-key-not-valid.-please-pass-a-valid-api-key.":"La clave de Firebase no es válida.",
  "permission-denied":"Firebase bloqueó la operación. Hay que revisar las reglas de seguridad."
 };
 const code = error && error.code ? error.code : "sin código";
 const detail = error && error.message ? error.message : "Sin detalle técnico";
 $(target).textContent = (messages[code] || detail || "Ocurrió un error. Inténtalo de nuevo.") + " [ " + code + " ]";
}
function setBusy(busy) {
 $("enter").disabled = busy; $("register").disabled = busy; $("forgot").disabled = busy;
}
try {
 firebase.initializeApp(firebaseConfig);
 auth = firebase.auth(); db = firebase.firestore();
} catch (error) { $("status").textContent = "No se pudo iniciar Firebase: " + error.message; }
$("authForm").addEventListener("submit", async event => {
 event.preventDefault(); $("status").textContent = "";
 if (!auth) return;
 setBusy(true);
 try { await auth.signInWithEmailAndPassword($("email").value.trim(), $("password").value); }
 catch(error) { showError("status", error); }
 finally { setBusy(false); }
});
$("register").addEventListener("click", async () => {
 $("status").textContent = "";
 if (!auth) return;
 const email = $("email").value.trim(), password = $("password").value;
 if (!email || password.length < 6) { $("status").textContent = "Escribe un correo válido y una contraseña de al menos 6 caracteres."; return; }
 setBusy(true);
 try { await auth.createUserWithEmailAndPassword(email, password); $("status").textContent = "Cuenta creada correctamente."; }
 catch(error) { showError("status", error); }
 finally { setBusy(false); }
});
$("forgot").addEventListener("click", async () => {
 $("status").textContent = "";
 if (!auth) return;
 const email = $("email").value.trim();
 if (!email) { $("status").textContent = "Escribe primero tu correo electrónico y vuelve a pulsar aquí."; $("email").focus(); return; }
 setBusy(true);
 try {
  await auth.sendPasswordResetEmail(email);
  $("status").textContent = "Si el correo está registrado, Firebase enviará un enlace para cambiar la contraseña. Revisa también Spam o Correo no deseado.";
 } catch(error) {
  const messages = {
   "auth/invalid-email":"El correo electrónico no es válido.",
   "auth/user-not-found":"No encontramos una cuenta con ese correo.",
   "auth/too-many-requests":"Se hicieron demasiados intentos. Espera un momento e inténtalo de nuevo.",
   "auth/network-request-failed":"No hay conexión. Revisa tu internet e inténtalo de nuevo."
  };
  $("status").textContent = messages[error.code] || "No se pudo enviar el correo. Inténtalo de nuevo.";
 } finally { setBusy(false); }
});
$("logout").onclick = async () => { if (unsubscribe) { unsubscribe(); unsubscribe = null; } await auth.signOut(); };
auth && auth.onAuthStateChanged(user => {
 $("login").style.display = user ? "none" : "block";
 $("chat").style.display = user ? "block" : "none";
 if (user) { $("who").textContent = "Conectado: " + (user.email || "usuario"); loadMessages(); }
 else { if (unsubscribe) unsubscribe(); unsubscribe = null; $("messages").innerHTML = ""; }
});
async function getMediaUrl(path) {
 if (!path) return "";
 const cached = mediaUrlCache.get(path);
 if (cached && cached.expiresAt > Date.now() + 60000) return cached.url;
 const user = auth && auth.currentUser;
 if (!user) return "";
 const idToken = await user.getIdToken();
 const response = await fetch(SUPABASE_URL + "/functions/v1/media", {
  method: "POST",
  headers: { "Content-Type": "application/json", "apikey": SUPABASE_PUBLISHABLE_KEY, "Authorization": "Bearer " + idToken },
  body: JSON.stringify({ action: "create-download-url", path })
 });
 const result = await response.json().catch(() => ({}));
 if (!response.ok || !result.signedUrl) throw new Error(result.error || "No se pudo abrir el archivo multimedia.");
 mediaUrlCache.set(path, { url: result.signedUrl, expiresAt: Date.now() + Number(result.expiresIn || 3600) * 1000 });
 return result.signedUrl;
}
function loadMessages() {
 if (unsubscribe) unsubscribe();
 $("messages").textContent = "Cargando mensajes...";
 unsubscribe = db.collection("messages").orderBy("createdAt").limit(100).onSnapshot(async snapshot => {
  $("messages").innerHTML = "";
  if (snapshot.empty) { $("messages").textContent = "Todavía no hay mensajes. ¡Envía el primero!"; return; }
  for (const doc of snapshot.docs) {
   const data = doc.data(), item = document.createElement("div");
   item.className = "msg" + (auth.currentUser && data.uid === auth.currentUser.uid ? " mine" : "");
   const sender = document.createElement("b"); sender.textContent = data.email || "Familia"; item.appendChild(sender);
   if ((data.type === "image" || data.type === "audio") && (data.storagePath || data.mediaUrl)) {
    const placeholder = document.createElement("p"); placeholder.textContent = "Cargando archivo..."; item.appendChild(placeholder); $("messages").appendChild(item);
    try {
     const url = data.storagePath ? await getMediaUrl(data.storagePath) : data.mediaUrl; placeholder.remove();
     if (data.type === "image") { const img = document.createElement("img"); img.src = url; img.alt = "Foto compartida"; img.loading = "lazy"; item.appendChild(img); }
     else { const audio = document.createElement("audio"); audio.controls = true; audio.preload = "metadata"; audio.src = url; item.appendChild(audio); }
    } catch(error) { placeholder.textContent = "No se pudo cargar: " + error.message; }
   } else { const body = document.createElement("p"); body.textContent = data.text || ""; item.appendChild(body); $("messages").appendChild(item); }
  }
  $("messages").scrollTop = $("messages").scrollHeight;
 }, error => showError("chatStatus", error));
}
$("send").onclick = async () => {
 const text = $("message").value.trim(), user = auth && auth.currentUser;
 if (!text || !user || sending) return;
 sending = true; $("send").disabled = true; $("chatStatus").textContent = "";
 try {
  await db.collection("messages").add({type:"text", text, email:user.email || "", uid:user.uid, createdAt:firebase.firestore.FieldValue.serverTimestamp()});
  $("message").value = "";
 } catch(error) { showError("chatStatus", error); }
 finally { sending = false; $("send").disabled = false; }
};

async function uploadMedia(file, type, durationSeconds = null) {
 const user = auth && auth.currentUser;
 if (!user || !file || sending) return;
 const maxBytes = type === "image" ? 10 * 1024 * 1024 : 20 * 1024 * 1024;
 if (file.size > maxBytes) { $("chatStatus").textContent = type === "image" ? "La foto debe pesar menos de 10 MB." : "La nota de voz debe pesar menos de 20 MB."; return; }
 if (type === "image" && !file.type.startsWith("image/")) { $("chatStatus").textContent = "Selecciona un archivo de imagen."; return; }
 if (type === "audio" && !file.type.startsWith("audio/")) { $("chatStatus").textContent = "No se pudo reconocer el formato del audio."; return; }
 sending = true;
 $("chatStatus").textContent = "Preparando archivo...";
 $("send").disabled = true; $("pickPhoto").disabled = true; $("takePhoto").disabled = true; $("recordAudio").disabled = true; $("sendAudio").disabled = true;
 try {
  const mimeType = file.type || (type === "image" ? "image/jpeg" : "audio/webm");
  const idToken = await user.getIdToken();
  const response = await fetch(SUPABASE_URL + "/functions/v1/media", {
   method: "POST",
   headers: { "Content-Type": "application/json", "apikey": SUPABASE_PUBLISHABLE_KEY, "Authorization": "Bearer " + idToken },
   body: JSON.stringify({ action: "create-upload", type, size: file.size, mimeType })
  });
  const signed = await response.json().catch(() => ({}));
  if (!response.ok || !signed.path || !signed.token) throw new Error(signed.error || "No se pudo preparar la carga en Supabase.");
  $("chatStatus").textContent = "Subiendo archivo...";
  const { error: uploadError } = await supabaseClient.storage.from("klk-media").uploadToSignedUrl(signed.path, signed.token, file, { contentType: mimeType });
  if (uploadError) throw uploadError;
  await db.collection("messages").add({
   type, storagePath: signed.path, mimeType, fileName: file.name || (type === "image" ? "foto" : "nota-de-voz"),
   size: file.size, ...(durationSeconds === null ? {} : {duration:durationSeconds}),
   email:user.email || "", uid:user.uid, createdAt:firebase.firestore.FieldValue.serverTimestamp()
  });
  $("chatStatus").textContent = type === "image" ? "Foto enviada." : "Nota de voz enviada.";
 } catch(error) {
  console.error("Error al enviar archivo:", error);
  $("chatStatus").textContent = "No se pudo enviar el archivo: " + (error.message || "Error desconocido");
 } finally {
  sending = false; $("send").disabled = false; $("pickPhoto").disabled = false; $("takePhoto").disabled = false; $("recordAudio").disabled = false; $("sendAudio").disabled = !audioBlob;
 }
}
$("pickPhoto").onclick = () => $("galleryInput").click();
$("takePhoto").onclick = () => $("cameraInput").click();
$("galleryInput").addEventListener("change", async event => { const file = event.target.files && event.target.files[0]; if (file) await uploadMedia(file,"image"); event.target.value = ""; });
$("cameraInput").addEventListener("change", async event => { const file = event.target.files && event.target.files[0]; if (file) await uploadMedia(file,"image"); event.target.value = ""; });
$("recordAudio").addEventListener("click", async () => {
 if (mediaRecorder && mediaRecorder.state === "recording") {
  mediaRecorder.stop();
  return;
 }
 if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
  $("recordStatus").textContent = "Este teléfono o navegador no permite grabar audio aquí. Actualiza Chrome y vuelve a intentarlo.";
  return;
 }
 try {
  audioStream = await navigator.mediaDevices.getUserMedia({audio:true});
  const mimeType = ["audio/webm;codecs=opus","audio/webm","audio/mp4"].find(type => MediaRecorder.isTypeSupported(type)) || "";
  mediaRecorder = new MediaRecorder(audioStream, mimeType ? {mimeType} : undefined);
  const chunks = [];
  mediaRecorder.ondataavailable = event => { if (event.data && event.data.size) chunks.push(event.data); };
  mediaRecorder.onstop = () => {
   const type = mediaRecorder.mimeType || "audio/webm";
   audioBlob = new Blob(chunks,{type});
   $("sendAudio").disabled = !audioBlob.size;
   $("recordAudio").textContent = "🎙️ Grabar otra vez";
   const seconds = Math.max(1,Math.round((Date.now()-audioStartedAt)/1000));
   $("recordStatus").textContent = "Audio grabado (" + seconds + " s). Pulsa «Enviar nota de voz».";
   if (audioStream) audioStream.getTracks().forEach(track => track.stop());
   audioStream = null;
   mediaRecorder = null;
   $("recordAudio").disabled = false;
   $("sendAudio").dataset.duration = String(seconds);
  };
  mediaRecorder.start();
  audioStartedAt = Date.now();
  $("recordAudio").textContent = "⏹️ Detener grabación";
  $("recordStatus").textContent = "Grabando... Pulsa detener cuando termines.";
 } catch(error) {
  $("recordStatus").textContent = error.name === "NotAllowedError" ? "Permite el acceso al micrófono para grabar notas de voz." : "No se pudo iniciar la grabación: " + error.message;
  if (audioStream) audioStream.getTracks().forEach(track => track.stop());
  audioStream = null;
 }
});
$("sendAudio").onclick = async () => {
 if (!audioBlob) return;
 const ext = audioBlob.type.includes("mp4") ? "m4a" : "webm";
 const file = new File([audioBlob],"nota-de-voz." + ext,{type:audioBlob.type});
 const duration = Number($("sendAudio").dataset.duration || 0);
 $("sendAudio").disabled = true;
 await uploadMedia(file,"audio",duration);
 audioBlob = null;
 $("sendAudio").disabled = true;
 $("recordStatus").textContent = "";
 $("recordAudio").textContent = "🎙️ Grabar audio";
};

$("message").addEventListener("keydown", event => { if (event.key === "Enter") $("send").click(); });
</script>
<script>
if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(error => console.error("Service worker:", error)));
</script>
<script>
let pendingInstall = null;
window.addEventListener("beforeinstallprompt", event => {
 event.preventDefault();
 pendingInstall = event;
 $("installApp").hidden = false;
});
$("installApp").addEventListener("click", async () => {
 if (!pendingInstall) {
  $("status").textContent = "Para instalar: abre el menú ⋮ de Chrome y elige Instalar aplicación o Añadir a pantalla de inicio.";
  return;
 }
 pendingInstall.prompt();
 const choice = await pendingInstall.userChoice;
 if (choice && choice.outcome === "accepted") $("installApp").hidden = true;
 pendingInstall = null;
});
window.addEventListener("appinstalled", () => {
 $("installApp").hidden = true;
 pendingInstall = null;
});
if (window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone) {
 $("installApp").hidden = true;
}
</script>
</body></html>
