<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#075e54"><meta name="description" content="Mensajería privada uno a uno.">
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>klk · Mensajes privados</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#efeae2;color:#17211e;font:16px Arial,sans-serif;min-height:100dvh}header{position:sticky;top:0;z-index:4;background:#075e54;color:white;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;font-size:23px;font-weight:bold}header small{display:block;font-size:12px;font-weight:normal;margin-top:4px}main{max-width:760px;margin:auto;padding:12px 10px 30px}.card{background:#fff;border-radius:14px;padding:16px;margin:10px 0;box-shadow:0 2px 8px #0001}h2{font-size:19px;margin:0 0 12px}input,button{font:inherit;border-radius:24px;padding:12px;border:1px solid #d8dfdc}input{width:100%;margin:5px 0}button{background:#075e54;color:#fff;border:0;font-weight:bold;cursor:pointer;margin:4px 0}button.secondary{background:#e2f2ed;color:#075e54}button:disabled{opacity:.5}.row{display:flex;gap:8px;align-items:center}.row>*{min-width:0}.row input{flex:1}.tabs{display:flex;gap:6px}.tabs button{flex:1}.tabs button.active{background:#128c7e}.person{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #eee}.person img,.avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#d9e8e2;display:grid;place-items:center;color:#075e54;font-weight:bold;flex:none}.person .meta{flex:1;min-width:0}.person small{display:block;color:#68736f;overflow-wrap:anywhere}.person button{padding:9px 13px}.hidden{display:none!important}.muted{color:#68736f;font-size:13px}.error{color:#a12b2b;white-space:pre-wrap;font-size:13px}.msg{max-width:86%;width:fit-content;background:white;border-radius:12px 12px 12px 3px;padding:9px 12px;margin:8px 0;overflow-wrap:anywhere}.msg.mine{margin-left:auto;background:#d9fdd3;border-radius:12px 12px 3px 12px}.msg small{display:block;color:#087568;font-size:11px;margin-bottom:4px}#messageList{height:48dvh;min-height:230px;overflow:auto;padding:8px;background:#efeae2;border-radius:10px}.composer{display:flex;gap:6px;margin-top:8px}.composer input{flex:1;min-width:0}.composer button{width:48px;flex:none}.profile{display:flex;align-items:center;gap:12px}.profile img{width:64px;height:64px;border-radius:50%;object-fit:cover;background:#eee}.callbox{position:fixed;inset:0;background:#000d;color:white;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}.callbox video{width:min(92vw,500px);max-height:55vh;background:#222;border-radius:14px}.callbox button{min-width:120px}#localVideo{position:absolute;width:110px;right:14px;top:50px;opacity:.9}.hint{font-size:12px;color:#68736f}
</style>
</head>
<body>
<header>klk <small>Mensajes privados · Siempre conectados</small></header>
<main>
<section id="login" class="card"><h2>Bienvenido a klk</h2><form id="authForm"><input id="email" type="email" placeholder="Correo electrónico" autocomplete="email" required><input id="password" type="password" minlength="6" placeholder="Contraseña (mínimo 6 caracteres)" required><button id="enter">Iniciar sesión</button></form><button id="register" class="secondary">Crear cuenta</button><button id="forgot" class="secondary">Olvidé mi contraseña</button><p id="authError" class="error"></p></section>
<section id="app" class="hidden">
<div class="card profile"><img id="myPhoto" alt="Foto de perfil"><div style="flex:1"><b id="myName">Mi perfil</b><small id="myEmail" class="muted"></small><input id="nameInput" maxlength="40" placeholder="Tu nombre"><div class="row"><button id="saveProfile">Guardar</button><button id="chooseAvatar" class="secondary">Foto</button></div><input id="avatarInput" type="file" accept="image/*" class="hidden"></div></div>
<div class="card"><div class="tabs"><button id="tabContacts" class="active">Contactos</button><button id="tabRequests" class="secondary">Solicitudes</button><button id="tabChats" class="secondary">Chats</button></div>
<div id="contactsPane"><h2>Personas en klk</h2><p class="muted">Envía una solicitud. Solo podrán hablar cuando la otra persona la acepte.</p><div id="peopleList">Cargando personas…</div></div>
<div id="requestsPane" class="hidden"><h2>Solicitudes recibidas</h2><div id="incomingList"></div><h2>Enviadas</h2><div id="outgoingList"></div></div>
<div id="chatsPane" class="hidden"><h2>Tus conversaciones</h2><div id="chatList"></div></div>
</div>
<section id="conversation" class="card hidden"><div class="row"><button id="back" class="secondary">←</button><div style="flex:1"><b id="chatTitle">Chat</b><small id="chatSubtitle" class="muted"></small></div><button id="voiceCall" title="Llamada de voz">📞</button><button id="videoCall" title="Videollamada">📹</button></div><div id="messageList"></div><div class="composer"><input id="message" maxlength="2000" placeholder="Escribe un mensaje"><button id="send">➤</button></div><p id="chatError" class="error"></p></section>
<button id="logout" class="secondary">Cerrar sesión</button>
</section>
</main>
<div id="callOverlay" class="callbox hidden"><h2 id="callTitle">Llamada</h2><p id="callStatus">Conectando…</p><video id="remoteVideo" autoplay playsinline></video><video id="localVideo" autoplay muted playsinline></video><div class="row"><button id="acceptCall" class="hidden">Aceptar</button><button id="declineCall" class="secondary hidden">Rechazar</button><button id="hangup" style="background:#b3261e">Colgar</button></div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyAgMkDOS77y-jHnzCEteQW1UgC90gShjuU",authDomain:"klk-familia.firebaseapp.com",projectId:"klk-familia",storageBucket:"klk-familia.firebasestorage.app",messagingSenderId:"184754934059",appId:"1:184754934059:web:1d385677b2c7c00699b56e"};
const $=id=>document.getElementById(id);firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.firestore(),storage=firebase.storage();
let me=null,myProfile={},outgoingPending=new Set(),activeContact=null,activeConversation=null,stopPeople=null,stopIncoming=null,stopOutgoing=null,stopChats=null,stopMessages=null,stopIncomingCalls=null,callRef=null,pc=null,localStream=null,callListeners=[],callMode="audio",callRole="",callBusy=false;
const err=(id,e)=>{$(id).textContent=(e&&e.message?e.message:"Error inesperado")+" ["+(e&&e.code?e.code:"sin código")+"]";console.error(e)};
const clean=()=>{[stopPeople,stopIncoming,stopOutgoing,stopChats,stopMessages,stopIncomingCalls].forEach(fn=>{if(fn)fn()});stopPeople=stopIncoming=stopOutgoing=stopChats=stopMessages=stopIncomingCalls=null};
const pairId=(a,b)=>[a,b].sort().join("__");
function profileName(p){return p.displayName||p.email||"Usuario"}
function personNode(p,buttonText,action){const row=document.createElement("div");row.className="person";const img=document.createElement("img");img.src=p.photoURL||"";img.alt="";img.onerror=()=>{img.style.display="none"};row.appendChild(img);const meta=document.createElement("div");meta.className="meta";const b=document.createElement("b");b.textContent=profileName(p);const sm=document.createElement("small");sm.textContent=p.email||"";meta.append(b,sm);row.appendChild(meta);if(action){const btn=document.createElement("button");btn.textContent=buttonText;btn.onclick=action;row.appendChild(btn)}return row}
function switchTab(which){["contacts","requests","chats"].forEach(k=>{$(k+"Pane").classList.toggle("hidden",k!==which);$("tab"+k[0].toUpperCase()+k.slice(1)).classList.toggle("active",k===which);$("tab"+k[0].toUpperCase()+k.slice(1)).classList.toggle("secondary",k!==which)})}
$("tabContacts").onclick=()=>switchTab("contacts");$("tabRequests").onclick=()=>switchTab("requests");$("tabChats").onclick=()=>switchTab("chats");
$("authForm").onsubmit=async e=>{e.preventDefault();$("authError").textContent="";try{await auth.signInWithEmailAndPassword($("email").value.trim(),$("password").value)}catch(x){err("authError",x)}};
$("register").onclick=async()=>{const email=$("email").value.trim(),password=$("password").value;if(!email||password.length<6){$("authError").textContent="Escribe un correo válido y una contraseña de al menos 6 caracteres.";return}try{await auth.createUserWithEmailAndPassword(email,password)}catch(x){err("authError",x)}};
$("forgot").onclick=async()=>{const email=$("email").value.trim();if(!email){$("authError").textContent="Escribe tu correo primero.";return}try{await auth.sendPasswordResetEmail(email);$("authError").textContent="Si la cuenta existe, recibirás un enlace para cambiar la contraseña."}catch(x){err("authError",x)}};
auth.onAuthStateChanged(async user=>{clean();me=user;if(!user){$("login").classList.remove("hidden");$("app").classList.add("hidden");$("conversation").classList.add("hidden");return}$("login").classList.add("hidden");$("app").classList.remove("hidden");await ensureProfile(user);startDirectory();startRequests();startChats();startIncomingCalls()});
async function ensureProfile(user){const ref=db.collection("users").doc(user.uid),snap=await ref.get();if(!snap.exists){myProfile={uid:user.uid,email:user.email||"",displayName:(user.email||"Usuario").split("@")[0],photoURL:"",createdAt:firebase.firestore.FieldValue.serverTimestamp()};await ref.set(myProfile)}else myProfile=snap.data();renderProfile()}
function renderProfile(){$("myName").textContent=profileName(myProfile);$("myEmail").textContent=me.email||"";$("nameInput").value=myProfile.displayName||"";$("myPhoto").src=myProfile.photoURL||""}
$("saveProfile").onclick=async()=>{const displayName=$("nameInput").value.trim();if(!displayName){$("authError").textContent="Escribe un nombre.";return}try{await db.collection("users").doc(me.uid).set({displayName,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});myProfile.displayName=displayName;renderProfile()}catch(e){err("authError",e)}};
$("chooseAvatar").onclick=()=>$("avatarInput").click();
$("avatarInput").onchange=async e=>{const file=e.target.files[0];if(!file)return;if(!file.type.startsWith("image/")||file.size>5*1024*1024){$("authError").textContent="Elige una imagen de máximo 5 MB.";return}try{const ref=storage.ref("users/"+me.uid+"/profile/avatar");await ref.put(file,{contentType:file.type});const photoURL=await ref.getDownloadURL();await db.collection("users").doc(me.uid).update({photoURL});myProfile.photoURL=photoURL;renderProfile()}catch(x){err("authError",x)}e.target.value=""};
function startDirectory(){if(stopPeople)stopPeople();$("peopleList").textContent="Cargando…";stopPeople=db.collection("users").orderBy("displayName").onSnapshot(async snap=>{const rows=[];for(const d of snap.docs){if(d.id===me.uid)continue;const p=d.data(),c=await db.collection("users").doc(me.uid).collection("contacts").doc(d.id).get();let action=null,label="Enviar solicitud";if(c.exists){label="Abrir chat";action=()=>openChat(d.id,p)}else if(outgoingPending.has(d.id)){label="Pendiente";action=null}else action=()=>sendRequest(d.id);rows.push({p,label,action})}const root=$("peopleList");root.innerHTML="";if(!rows.length)root.textContent="Todavía no hay otros miembros registrados.";rows.forEach(x=>root.appendChild(personNode(x.p,x.label,x.action)))},e=>err("authError",e))}
async function sendRequest(toUid){try{if(toUid===me.uid)return;const ref=db.collection("contactRequests").doc(me.uid+"_"+toUid);await ref.set({fromUid:me.uid,toUid,status:"pending",createdAt:firebase.firestore.FieldValue.serverTimestamp()});$("authError").textContent="Solicitud enviada."}catch(e){err("authError",e)}}
function startRequests(){stopIncoming=db.collection("contactRequests").where("toUid","==",me.uid).onSnapshot(s=>{const root=$("incomingList");root.innerHTML="";const pending=s.docs.filter(d=>d.data().status==="pending");if(!pending.length)root.textContent="No tienes solicitudes pendientes.";pending.forEach(d=>{const x=d.data();db.collection("users").doc(x.fromUid).get().then(u=>{if(!u.exists)return;root.appendChild(personNode(u.data(),"Aceptar",()=>acceptRequest(d.id,x.fromUid)))})})},e=>err("authError",e));stopOutgoing=db.collection("contactRequests").where("fromUid","==",me.uid).onSnapshot(s=>{outgoingPending=new Set(s.docs.filter(d=>d.data().status==="pending").map(d=>d.data().toUid));if(stopPeople)startDirectory();const root=$("outgoingList");root.innerHTML="";s.docs.forEach(d=>{const x=d.data();db.collection("users").doc(x.toUid).get().then(u=>{if(u.exists)root.appendChild(personNode(u.data(),x.status==="accepted"?"Aceptada":"Pendiente",null))})})},e=>err("authError",e))}
async function acceptRequest(requestId,fromUid){try{const batch=db.batch(),req=db.collection("contactRequests").doc(requestId),convId=pairId(me.uid,fromUid);batch.update(req,{status:"accepted",acceptedAt:firebase.firestore.FieldValue.serverTimestamp()});batch.set(db.collection("users").doc(me.uid).collection("contacts").doc(fromUid),{otherUid:fromUid,requestId,createdAt:firebase.firestore.FieldValue.serverTimestamp()});batch.set(db.collection("users").doc(fromUid).collection("contacts").doc(me.uid),{otherUid:me.uid,requestId,createdAt:firebase.firestore.FieldValue.serverTimestamp()});batch.set(db.collection("conversations").doc(convId),{members:[me.uid,fromUid].sort(),createdAt:firebase.firestore.FieldValue.serverTimestamp(),createdBy:me.uid},{merge:true});await batch.commit()}catch(e){err("authError",e)}}
function startChats(){stopChats=db.collection("conversations").where("members","array-contains",me.uid).onSnapshot(async s=>{const root=$("chatList");root.innerHTML="";if(s.empty){root.textContent="Acepta o envía una solicitud para comenzar a conversar.";return}for(const d of s.docs){const other=d.data().members.find(x=>x!==me.uid);const u=await db.collection("users").doc(other).get();if(u.exists)root.appendChild(personNode(u.data(),"Abrir",()=>openChat(other,u.data(),d.id))) }},e=>err("authError",e))}
async function openChat(otherUid,p,knownId){activeContact={uid:otherUid,profile:p};activeConversation=knownId||pairId(me.uid,otherUid);try{const ref=db.collection("conversations").doc(activeConversation),snap=await ref.get();if(!snap.exists)await ref.set({members:[me.uid,otherUid].sort(),createdAt:firebase.firestore.FieldValue.serverTimestamp(),createdBy:me.uid});$("conversation").classList.remove("hidden");$("contactsPane").classList.add("hidden");$("requestsPane").classList.add("hidden");$("chatsPane").classList.add("hidden");$("chatTitle").textContent=profileName(p);$("chatSubtitle").textContent=p.email||"";loadMessages()}catch(e){err("chatError",e)}}
function loadMessages(){if(stopMessages)stopMessages();$("messageList").innerHTML="";stopMessages=db.collection("conversations").doc(activeConversation).collection("messages").orderBy("createdAt").limit(150).onSnapshot(s=>{const root=$("messageList");root.innerHTML="";s.forEach(d=>{const x=d.data(),el=document.createElement("div");el.className="msg"+(x.uid===me.uid?" mine":"");const who=document.createElement("small");who.textContent=x.uid===me.uid?"Tú":profileName(activeContact.profile);const body=document.createElement("div");body.textContent=x.text;el.append(who,body);root.appendChild(el)});root.scrollTop=root.scrollHeight},e=>err("chatError",e))}
async function sendMessage(){const text=$("message").value.trim();if(!text||!activeConversation)return;try{await db.collection("conversations").doc(activeConversation).collection("messages").add({uid:me.uid,text,createdAt:firebase.firestore.FieldValue.serverTimestamp()});$("message").value="";$("chatError").textContent=""}catch(e){err("chatError",e)}}
$("send").onclick=sendMessage;$("message").onkeydown=e=>{if(e.key==="Enter")sendMessage()};$("back").onclick=()=>{$("conversation").classList.add("hidden");switchTab("chats");if(stopMessages)stopMessages();stopMessages=null;activeConversation=null};
$("logout").onclick=async()=>{clean();await auth.signOut()};
function startIncomingCalls(){stopIncomingCalls=db.collectionGroup("calls").where("calleeId","==",me.uid).onSnapshot(s=>{s.docChanges().forEach(change=>{if(change.type==="added")showIncomingCall(change.doc.ref,change.doc.data())})},e=>console.warn("Llamadas entrantes",e))}
function showIncomingCall(ref,data){if(callBusy)return;callBusy=true;callRef=ref;callRole="callee";callMode=data.type;$("callOverlay").classList.remove("hidden");$("callTitle").textContent=data.type==="video"?"Videollamada entrante":"Llamada entrante";$("callStatus").textContent="Llamada de "+data.callerName;$("acceptCall").classList.remove("hidden");$("declineCall").classList.remove("hidden")}
function newPeer(){pc=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});pc.ontrack=e=>{$("remoteVideo").srcObject=e.streams[0]};pc.onconnectionstatechange=()=>{$("callStatus").textContent="Estado: "+pc.connectionState};return pc}
async function attachCandidates(ref,role){const other=role==="caller"?"calleeCandidates":"callerCandidates";const unsub=ref.collection(other).onSnapshot(s=>s.docChanges().forEach(async c=>{if(c.type==="added"&&pc){try{await pc.addIceCandidate(new RTCIceCandidate(c.doc.data()))}catch(e){console.warn(e)}}}));callListeners.push(unsub);pc.onicecandidate=e=>{if(e.candidate)ref.collection(role==="caller"?"callerCandidates":"calleeCandidates").add(e.candidate.toJSON()).catch(console.warn)}}
async function beginCall(type){if(callBusy||!activeConversation)return;callBusy=true;callRole="caller";callMode=type;try{localStream=await navigator.mediaDevices.getUserMedia({audio:true,video:type==="video"});$("localVideo").srcObject=localStream;$("localVideo").classList.toggle("hidden",type!=="video");$("remoteVideo").classList.toggle("hidden",type!=="video");$("callOverlay").classList.remove("hidden");$("callTitle").textContent=type==="video"?"Videollamada":"Llamada de voz";$("callStatus").textContent="Llamando a "+profileName(activeContact.profile)+"…";$("acceptCall").classList.add("hidden");$("declineCall").classList.add("hidden");newPeer();localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));const offer=await pc.createOffer();callRef=db.collection("conversations").doc(activeConversation).collection("calls").doc();await callRef.set({callerId:me.uid,callerName:profileName(myProfile),calleeId:activeContact.uid,conversationId:activeConversation,type,status:"ringing",offer:{type:offer.type,sdp:offer.sdp},createdAt:firebase.firestore.FieldValue.serverTimestamp()});await attachCandidates(callRef,"caller");await pc.setLocalDescription(offer);callListeners.push(callRef.onSnapshot(async s=>{const d=s.data();if(!d)return;if(d.answer&&pc&&pc.signalingState==="have-local-offer")await pc.setRemoteDescription(new RTCSessionDescription(d.answer));if(d.status==="ended")finishCall(false)}))}catch(e){err("chatError",e);finishCall(false)}}
async function acceptIncoming(){if(!callRef)return;try{localStream=await navigator.mediaDevices.getUserMedia({audio:true,video:callMode==="video"});$("localVideo").srcObject=localStream;$("localVideo").classList.toggle("hidden",callMode!=="video");$("remoteVideo").classList.toggle("hidden",callMode!=="video");newPeer();localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));await pc.setRemoteDescription(new RTCSessionDescription(callRefData.offer));const answer=await pc.createAnswer();await attachCandidates(callRef,"callee");await pc.setLocalDescription(answer);await callRef.update({answer:{type:answer.type,sdp:answer.sdp},status:"active"});callListeners.push(callRef.onSnapshot(s=>{if(s.data()&&s.data().status==="ended")finishCall(false)}));$("callStatus").textContent="Conectando…";$("acceptCall").classList.add("hidden");$("declineCall").classList.add("hidden")}catch(e){err("chatError",e);finishCall(true)}}
let callRefData=null;
function finishCall(update){if(update&&callRef)callRef.update({status:"ended"}).catch(console.warn);callListeners.forEach(fn=>fn());callListeners=[];if(pc){pc.close();pc=null}if(localStream){localStream.getTracks().forEach(t=>t.stop());localStream=null}$("localVideo").srcObject=null;$("remoteVideo").srcObject=null;$("callOverlay").classList.add("hidden");$("acceptCall").classList.add("hidden");$("declineCall").classList.add("hidden");callBusy=false;callRef=null;callRefData=null}
$("voiceCall").onclick=()=>beginCall("audio");$("videoCall").onclick=()=>beginCall("video");$("hangup").onclick=()=>finishCall(true);$("declineCall").onclick=()=>finishCall(true);$("acceptCall").onclick=acceptIncoming;
const originalShowIncoming=showIncomingCall;showIncomingCall=function(ref,data){callRefData=data;originalShowIncoming(ref,data)};
</script>
<script>if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(console.warn));</script>
</body></html>
