<style>
*{box-sizing:border-box}body{margin:0;background:#efeae2;color:#17211e;font:15px Arial,sans-serif}header{background:#075e54;color:#fff;padding:16px;padding-top:calc(16px + env(safe-area-inset-top));font-size:24px;font-weight:bold}header small{display:block;font-size:12px;font-weight:normal;margin-top:4px}main{max-width:760px;margin:auto;padding:12px}.panel{background:white;border-radius:12px;padding:16px;margin:10px 0;box-shadow:0 2px 8px #0001}h2{font-size:18px;margin:0 0 12px}input,button{font:inherit;border-radius:22px;padding:12px;border:1px solid #ccd5d1;margin:4px 0}input{width:100%}button{background:#075e54;color:white;border:0;font-weight:bold;cursor:pointer}button.alt{background:#e4f2ed;color:#075e54}button:disabled{opacity:.5}.row{display:flex;gap:8px;align-items:center}.row input{flex:1;min-width:0}.row button{white-space:nowrap}.item{padding:12px 4px;border-bottom:1px solid #e8ece9}.item:last-child{border:0}.muted{font-size:12px;color:#65736e}.error{color:#a22;white-space:pre-wrap}.hidden{display:none!important}#messages{height:48vh;overflow:auto;background:#efeae2;padding:10px;border-radius:8px}.bubble{background:white;padding:9px 12px;border-radius:12px;margin:7px 0;max-width:85%;width:fit-content;overflow-wrap:anywhere}.bubble.mine{margin-left:auto;background:#d9fdd3}.bubble img{max-width:100%;max-height:300px}.bubble audio{max-width:100%}.tabs{display:flex;gap:6px}.tabs button{flex:1}.chatbar{display:flex;gap:6px}.chatbar input{flex:1;min-width:0}.chatbar button{padding:10px}.danger{background:#a33}@media(max-width:500px){main{padding:6px}.panel{border-radius:8px}}
</style></head><body><header>klk <small>Chats privados y contactos, siempre conectados ❤️</small></header><main>
<section id="auth" class="panel"><h2>Bienvenido a klk</h2><form id="authForm"><input id="email" type="email" placeholder="Correo electrónico" autocomplete="email" required><input id="password" type="password" minlength="6" placeholder="Contraseña (mínimo 6 caracteres)" required><button type="submit">Iniciar sesión</button></form><button id="register" class="alt">Crear cuenta</button><button id="forgot" class="alt">Recuperar contraseña</button><p id="authStatus" class="error"></p></section>
<section id="app" class="hidden">
<div class="panel"><div class="row"><div style="flex:1"><b id="myEmail"></b><div class="muted">Tu cuenta klk</div></div><button id="logout" class="alt">Salir</button></div></div>
<div class="panel"><h2>👥 Contactos</h2><div class="row"><input id="searchEmail" type="email" placeholder="Correo de la persona"><button id="sendRequest">Enviar solicitud</button></div><p id="contactStatus" class="muted"></p><h3>Solicitudes recibidas</h3><div id="incoming" class="muted">Cargando...</div><h3>Mis contactos</h3><div id="contacts" class="muted">Cargando...</div></div>
<div id="chatPanel" class="panel hidden"><div class="row"><button id="back" class="alt">←</button><div style="flex:1"><b id="chatName">Chat privado</b></div></div><div id="messages"></div><div class="chatbar"><input id="message" maxlength="2000" placeholder="Escribe un mensaje"><button id="send">➤</button></div><div class="row"><button id="photo" class="alt">📷 Foto</button><button id="record" class="alt">🎙️ Grabar nota</button><button id="audio" class="alt">📎 Audio</button><button id="call" class="alt">📞 Voz</button><button id="videoCall" class="alt">📹 Video</button></div><input id="photoFile" type="file" accept="image/*" hidden><input id="audioFile" type="file" accept="audio/*" hidden><p id="chatStatus" class="muted"></p><div id="callPanel" class="hidden"><p id="callStatus" class="muted"></p><video id="remoteVideo" autoplay playsinline style="width:100%;max-height:240px;background:#111;border-radius:8px"></video><video id="localVideo" autoplay muted playsinline style="width:120px;max-height:160px;background:#333;border-radius:8px"></video><div class="row"><button id="acceptCall">Aceptar</button><button id="rejectCall" class="danger">Rechazar</button><button id="endCall" class="danger">Colgar</button></div></div></div>
</section></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script>
const cfg={apiKey:"AIzaSyAgMkDOS77y-jHnzCEteQW1UgC90gShjuU",authDomain:"klk-familia.firebaseapp.com",projectId:"klk-familia",storageBucket:"klk-familia.firebasestorage.app",messagingSenderId:"184754934059",appId:"1:184754934059:web:1d385677b2c7c00699b56e"};
firebase.initializeApp(cfg);const auth=firebase.auth(),db=firebase.firestore(),storage=firebase.storage();const $=id=>document.getElementById(id);
let user=null,activeConversation=null,activeContact=null,stopMessages=null,stopIncoming=null,stopContacts=null,stopCalls=[],pc=null,localStream=null,currentCallId=null,currentCallRef=null,currentCallMode="audio",incomingCallData=null,seenCallIds=new Set(),pendingIce=[],recorder=null,recordStream=null,recordChunks=[],stopCandidates=null,stopCallDoc=null;
function status(id,e){console.error(e);$(id).textContent=(e&&e.message?e.message:"Error inesperado")+(e&&e.code?" ["+e.code+"]":"")}
function pair(a,b){return [a,b].sort().join("_")}
function show(id,on){$(id).classList.toggle("hidden",!on)}
$("authForm").onsubmit=async e=>{e.preventDefault();try{await auth.signInWithEmailAndPassword($("email").value.trim(),$("password").value)}catch(x){status("authStatus",x)}};
$("register").onclick=async()=>{try{const c=await auth.createUserWithEmailAndPassword($("email").value.trim(),$("password").value);await db.collection("users").doc(c.user.uid).set({uid:c.user.uid,email:c.user.email.toLowerCase(),displayName:c.user.email.split("@")[0],createdAt:firebase.firestore.FieldValue.serverTimestamp()})}catch(x){status("authStatus",x)}};
$("forgot").onclick=async()=>{try{await auth.sendPasswordResetEmail($("email").value.trim());$("authStatus").textContent="Si el correo está registrado, recibirás un enlace de recuperación."}catch(x){status("authStatus",x)}};
$("logout").onclick=()=>auth.signOut();
auth.onAuthStateChanged(async u=>{user=u;show("auth",!u);show("app",!!u);show("chatPanel",false);if(!u){cleanup();return}$("myEmail").textContent=u.email;await db.collection("users").doc(u.uid).set({uid:u.uid,email:u.email.toLowerCase(),displayName:u.email.split("@")[0]},{merge:true});loadIncoming();loadContacts();watchCalls()});
function cleanup(){if(stopMessages)stopMessages();if(stopIncoming)stopIncoming();if(stopContacts)stopContacts();if(Array.isArray(stopCalls))stopCalls.forEach(fn=>fn());stopMessages=stopIncoming=stopContacts=null;stopCalls=[];if(recorder&&recorder.state!=="inactive")recorder.stop();if(recordStream)recordStream.getTracks().forEach(t=>t.stop());recordStream=null;recorder=null;closeMedia();activeConversation=null}
function closeMedia(){pendingIce=[];if(stopCandidates){stopCandidates();stopCandidates=null}if(stopCallDoc){stopCallDoc();stopCallDoc=null}if(pc){pc.close();pc=null}if(localStream){localStream.getTracks().forEach(t=>t.stop());localStream=null}$("localVideo").srcObject=null;$("remoteVideo").srcObject=null;show("callPanel",false);currentCallId=null;currentCallRef=null;incomingCallData=null}
function watchCalls(){stopCalls.forEach(fn=>fn());stopCalls=[];db.collection("contacts").where("members","array-contains",user.uid).get().then(s=>s.forEach(doc=>{const unsub=db.collection("conversations").doc(doc.id).collection("calls").where("calleeId","==",user.uid).where("status","==","ringing").onSnapshot(q=>q.docChanges().forEach(ch=>{if(ch.type!=="added"||seenCallIds.has(ch.doc.id))return;seenCallIds.add(ch.doc.id);const d=ch.doc.data();incomingCallData={id:ch.doc.id,ref:ch.doc.ref,data:d};currentCallId=ch.doc.id;currentCallRef=ch.doc.ref;currentCallMode=d.mode||"audio";$("callStatus").textContent="Llamada entrante de "+(d.callerEmail||"tu contacto");show("acceptCall",true);show("rejectCall",true);show("endCall",false);show("callPanel",true)}),e=>status("chatStatus",e));stopCalls.push(unsub)})).catch(e=>status("chatStatus",e))}
async function makePeer(callRef,mode){pc=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});pc.ontrack=e=>{const stream=e.streams[0];$("remoteVideo").srcObject=stream};pc.onicecandidate=e=>{if(e.candidate)callRef.collection("candidates").add({uid:user.uid,candidate:e.candidate.toJSON()}).catch(x=>status("callStatus",x))};pc.onconnectionstatechange=()=>{$("callStatus").textContent="Estado: "+pc.connectionState;if(["failed","disconnected","closed"].includes(pc.connectionState)){} };localStream=await navigator.mediaDevices.getUserMedia({audio:true,video:mode==="video"});localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));$("localVideo").srcObject=localStream;$("remoteVideo").style.display=mode==="video"?"block":"none";show("callPanel",true)}
async function startCall(mode){if(!activeConversation||!activeContact)return;try{const ref=db.collection("conversations").doc(activeConversation).collection("calls").doc();await makePeer(ref,mode);currentCallRef=ref;currentCallId=ref.id;currentCallMode=mode;show("acceptCall",false);show("rejectCall",false);show("endCall",true);const offer=await pc.createOffer();await pc.setLocalDescription(offer);await ref.set({conversationId:activeConversation,callerId:user.uid,calleeId:activeContact,callerEmail:user.email,mode,status:"ringing",offer:{type:offer.type,sdp:offer.sdp},createdAt:firebase.firestore.FieldValue.serverTimestamp()});stopCandidates=listenCandidates(ref);stopCallDoc=ref.onSnapshot(async snap=>{const d=snap.data();if(!d||!pc)return;if(d.answer&&!pc.remoteDescription){await pc.setRemoteDescription(new RTCSessionDescription(d.answer));await flushIce()}if(["rejected","ended","missed"].includes(d.status))closeMedia()});$("callStatus").textContent="Llamando...";}catch(e){closeMedia();status("chatStatus",e)}}
function listenCandidates(ref){return ref.collection("candidates").onSnapshot(s=>s.docChanges().forEach(ch=>{if(ch.type!=="added")return;const c=ch.doc.data();if(c.uid!==user.uid&&pc){const ice=new RTCIceCandidate(c.candidate);if(pc.remoteDescription)pc.addIceCandidate(ice).catch(e=>console.warn(e));else pendingIce.push(ice)}}))}
async function flushIce(){if(pc&&pc.remoteDescription){for(const ice of pendingIce.splice(0))try{await pc.addIceCandidate(ice)}catch(e){console.warn(e)}}}
async function acceptIncoming(){if(!incomingCallData)return;try{const {ref,data}=incomingCallData;await makePeer(ref,data.mode||"audio");await pc.setRemoteDescription(new RTCSessionDescription(data.offer));stopCandidates=listenCandidates(ref);await flushIce();const answer=await pc.createAnswer();await pc.setLocalDescription(answer);await ref.update({answer:{type:answer.type,sdp:answer.sdp},status:"accepted",acceptedAt:firebase.firestore.FieldValue.serverTimestamp()});show("acceptCall",false);show("rejectCall",false);show("endCall",true);$("callStatus").textContent="Conectando llamada...";}catch(e){status("callStatus",e)}}
async function endCall(state="ended"){try{if(currentCallRef)await currentCallRef.update({status:state,endedAt:firebase.firestore.FieldValue.serverTimestamp()})}catch(e){console.warn(e)}closeMedia()}
$("sendRequest").onclick=async()=>{const email=$("searchEmail").value.trim().toLowerCase();if(!email||email===user.email.toLowerCase()){$("contactStatus").textContent="Escribe el correo de otra persona.";return}try{const q=await db.collection("users").where("email","==",email).limit(1).get();if(q.empty){$("contactStatus").textContent="Esa persona todavía no se ha registrado.";return}const target=q.docs[0].data();const existingContact=await db.collection("contacts").doc(pair(user.uid,target.uid)).get();if(existingContact.exists){$("contactStatus").textContent="Esa persona ya está en tus contactos.";return}const dup=await db.collection("contactRequests").where("senderId","==",user.uid).where("recipientId","==",target.uid).where("status","==","pending").get();if(!dup.empty){$("contactStatus").textContent="Ya enviaste una solicitud a esa persona.";return}await db.collection("contactRequests").add({senderId:user.uid,recipientId:target.uid,senderEmail:user.email,recipientEmail:target.email,status:"pending",createdAt:firebase.firestore.FieldValue.serverTimestamp()});$("contactStatus").textContent="Solicitud enviada. Espera que la acepte.";$("searchEmail").value=""}catch(e){status("contactStatus",e)}};
function loadIncoming(){if(stopIncoming)stopIncoming();stopIncoming=db.collection("contactRequests").where("recipientId","==",user.uid).where("status","==","pending").onSnapshot(s=>{$("incoming").innerHTML="";if(s.empty)$("incoming").textContent="No tienes solicitudes pendientes.";s.forEach(d=>{const v=d.data(),el=document.createElement("div");el.className="item";const t=document.createElement("span");t.textContent=v.senderEmail+" ";el.append(t);const b=document.createElement("button");b.textContent="Aceptar";b.onclick=()=>acceptRequest(d.id,v);el.append(b);const no=document.createElement("button");no.textContent="Rechazar";no.className="alt";no.onclick=()=>db.collection("contactRequests").doc(d.id).update({status:"rejected"}).catch(e=>status("contactStatus",e));el.append(no);$("incoming").append(el)})},e=>status("incoming",e))}
async function acceptRequest(id,v){try{const cid=pair(v.senderId,v.recipientId),members=[v.senderId,v.recipientId].sort(),contactRef=db.collection("contacts").doc(cid),conversationRef=db.collection("conversations").doc(cid),requestRef=db.collection("contactRequests").doc(id),existing=await contactRef.get(),batch=db.batch();batch.update(requestRef,{status:"accepted"});if(!existing.exists)batch.set(contactRef,{members,requestId:id,createdAt:firebase.firestore.FieldValue.serverTimestamp()});batch.set(conversationRef,{members,createdAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});await batch.commit()}catch(e){status("contactStatus",e)}}
function loadContacts(){if(stopContacts)stopContacts();stopContacts=db.collection("contacts").where("members","array-contains",user.uid).onSnapshot(async s=>{watchCalls();$("contacts").innerHTML="";if(s.empty)$("contacts").textContent="Todavía no tienes contactos aceptados.";for(const d of s.docs){const other=d.data().members.find(x=>x!==user.uid);const u=await db.collection("users").doc(other).get();const v=u.data()||{email:"Usuario"};const b=document.createElement("button");b.className="alt";b.style.width="100%";b.textContent=v.displayName||v.email;b.onclick=()=>openChat(d.id,other,v.email);$("contacts").append(b)}},e=>status("contacts",e))}
async function openChat(cid,other,email){activeConversation=cid;activeContact=other;$("chatName").textContent=email;show("chatPanel",true);if(stopMessages)stopMessages();const ref=db.collection("conversations").doc(cid).collection("messages").orderBy("createdAt");stopMessages=ref.onSnapshot(s=>{$("messages").innerHTML="";s.forEach(d=>{const m=d.data(),el=document.createElement("div");el.className="bubble"+(m.uid===user.uid?" mine":"");if(m.type==="image"){const img=document.createElement("img");img.src=m.mediaUrl;img.alt="Foto";el.append(img)}else if(m.type==="audio"){const a=document.createElement("audio");a.controls=true;a.src=m.mediaUrl;el.append(a)}else el.textContent=m.text||"";$("messages").append(el)}$("messages").scrollTop=$("messages").scrollHeight},e=>status("chatStatus",e))}
$("back").onclick=()=>{show("chatPanel",false);if(stopMessages)stopMessages();stopMessages=null;activeConversation=null};
$("send").onclick=async()=>{const text=$("message").value.trim();if(!text||!activeConversation)return;try{await db.collection("conversations").doc(activeConversation).collection("messages").add({type:"text",text,uid:user.uid,createdAt:firebase.firestore.FieldValue.serverTimestamp()});$("message").value=""}catch(e){status("chatStatus",e)}};
$("message").onkeydown=e=>{if(e.key==="Enter")$("send").click()};
$("photo").onclick=()=>$("photoFile").click();$("audio").onclick=()=>$("audioFile").click();$("record").onclick=()=>toggleRecording();
$("photoFile").onchange=e=>upload(e.target.files[0],"image");$("audioFile").onchange=e=>upload(e.target.files[0],"audio");
async function toggleRecording(){if(!activeConversation){$("chatStatus").textContent="Abre un chat antes de grabar.";return}if(recorder&&recorder.state==="recording"){recorder.stop();$("record").textContent="🎙️ Grabar nota";return}try{recordStream=await navigator.mediaDevices.getUserMedia({audio:true});recordChunks=[];const mime=MediaRecorder.isTypeSupported("audio/webm;codecs=opus")?"audio/webm;codecs=opus":"";recorder=new MediaRecorder(recordStream,mime?{mimeType:mime}:undefined);recorder.ondataavailable=e=>{if(e.data&&e.data.size)recordChunks.push(e.data)};recorder.onstop=()=>{const type=recorder&&recorder.mimeType||"audio/webm";const file=new File(recordChunks,"nota-voz.webm",{type});recordStream&&recordStream.getTracks().forEach(t=>t.stop());recordStream=null;recorder=null;recordChunks=[];upload(file,"audio")};recorder.start();$("record").textContent="⏹ Detener";$("chatStatus").textContent="Grabando nota de voz...";}catch(e){if(recordStream)recordStream.getTracks().forEach(t=>t.stop());recordStream=null;recorder=null;status("chatStatus",e)}}
async function upload(file,type){if(!file||!activeConversation)return;const max=type==="image"?10*1024*1024:20*1024*1024;if(file.size>max){$("chatStatus").textContent="El archivo supera el límite permitido.";return}if(!file.type.startsWith(type+"/")){$("chatStatus").textContent="Formato de archivo no válido.";return}try{$("chatStatus").textContent="Subiendo archivo...";const path="conversations/"+activeConversation+"/"+user.uid+"/"+Date.now()+"-"+file.name.replace(/[^a-z0-9._-]/gi,"_");const ref=storage.ref().child(path);await ref.put(file,{contentType:file.type});const url=await ref.getDownloadURL();await db.collection("conversations").doc(activeConversation).collection("messages").add({type,mediaUrl:url,storagePath:path,mimeType:file.type,size:file.size,uid:user.uid,createdAt:firebase.firestore.FieldValue.serverTimestamp()});$("chatStatus").textContent="Archivo enviado."}catch(e){status("chatStatus",e)}finally{$(type==="image"?"photoFile":"audioFile").value=""}}
$("call").onclick=()=>startCall("audio");$("videoCall").onclick=()=>startCall("video");$("acceptCall").onclick=()=>acceptIncoming();$("rejectCall").onclick=()=>endCall("rejected");$("endCall").onclick=()=>endCall("ended");
if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(console.error));
</script></body></html>
