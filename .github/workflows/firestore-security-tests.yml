name: Firestore rules security tests

on:
  pull_request:
    paths:
      - 'firestore.rules'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/firestore-security-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Test Firestore rules against emulator
        run: npm run test:rules
