name: Publicar reglas de Firestore (manual)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: firestore-rules-production
  cancel-in-progress: false

jobs:
  test:
    name: Probar reglas antes de publicar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - run: npm run test:rules

  deploy:
    name: Publicar solo reglas de Firestore
    needs: test
    runs-on: ubuntu-latest
    environment: firestore-production
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Publicar reglas (sin índices ni otros servicios)
        run: npx firebase-tools deploy --only firestore:rules --project "${{ vars.GCP_PROJECT_ID }}" --non-interactive
