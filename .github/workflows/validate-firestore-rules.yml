name: Validar reglas Firestore
on:
  pull_request:
    paths:
      - 'firestore.rules'
      - 'tests/**'
      - '.github/workflows/validate-firestore-rules.yml'
  workflow_dispatch:
jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-audit --no-fund
      - run: npm run test:rules
