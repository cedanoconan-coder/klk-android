name: Firestore rules tests

on:
  push:
    branches:
      - fix/auth-messaging-stability-20261112
  pull_request:
    paths:
      - 'firestore.rules'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/firestore-rules-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # This repository currently has no package-lock.json; npm ci requires one.
      - run: npm install --no-audit --no-fund
      - name: Test Firestore rules against emulator
        run: npm run test:rules
