name: Construir APK de klk

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main", "fix/klk-private-chat"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Validar sintaxis JavaScript
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("index.html").read_text()
          scripts = re.findall(r"<script>([\\s\\S]*?)</script>", html)
          if not scripts:
              raise SystemExit("No se encontró el código JavaScript principal")
          Path("/tmp/klk-app.js").write_text(scripts[-1])
          PY
          node --check /tmp/klk-app.js

      - name: Instalar dependencias
        run: npm install

      - name: Preparar archivos web
        run: mkdir -p www && cp index.html icon.svg manifest.webmanifest sw.js www/

      - name: Generar proyecto Android
        run: npx cap add android

      - name: Instalar herramienta para iconos Android
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Aplicar logo klk a los iconos Android
        run: |
          set -e
          for item in mdpi:108 hdpi:162 xhdpi:216 xxhdpi:324 xxxhdpi:432; do
            density="${item%%:*}"
            size="${item##*:}"
            dir="android/app/src/main/res/mipmap-$density"
            mkdir -p "$dir"
            rsvg-convert -w "$size" -h "$size" icon.svg > "$dir/ic_launcher.png"
            cp "$dir/ic_launcher.png" "$dir/ic_launcher_round.png"
            cp "$dir/ic_launcher.png" "$dir/ic_launcher_foreground.png"
          done

      - name: Declarar permisos de cámara y micrófono
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          marker = '<application'
          permissions = '''    <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
          '''
          if marker not in s:
              raise SystemExit("No se encontró la etiqueta application en AndroidManifest.xml")
          s = s.replace(marker, permissions + marker, 1)
          p.write_text(s)
          PY

      - name: Sincronizar archivos
        run: npx cap sync android

      - name: Compilar APK de prueba
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: klk-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
