name: Construir APK de klk

on:
  push:
    branches: ["main", "market-readiness", "integrar-supabase-storage", "features/notificaciones-ajustes", "build/klk-ajustes-apk", "feature/complete-interface-settings", "feature/invitation-only-registration"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Probar reglas de seguridad de Firestore
        run: npm run test:rules

      - name: Preparar archivos web
        run: mkdir -p www && cp index.html calls.js icon.svg manifest.webmanifest sw.js www/

      - name: Verificar sintaxis JavaScript
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class InlineScripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.capture = False
                  self.current = []
                  self.scripts = []

              def handle_starttag(self, tag, attrs):
                  if tag == "script":
                      self.capture = not any(name.lower() == "src" for name, _ in attrs)
                      self.current = []

              def handle_data(self, data):
                  if self.capture:
                      self.current.append(data)

              def handle_endtag(self, tag):
                  if tag == "script" and self.capture:
                      self.scripts.append("".join(self.current))
                      self.capture = False

          parser = InlineScripts()
          parser.feed(Path("index.html").read_text(encoding="utf-8"))
          if not parser.scripts:
              raise SystemExit("No se encontraron scripts JavaScript para verificar.")
          for number, script in enumerate(parser.scripts, 1):
              Path(f"/tmp/klk-inline-{number}.js").write_text(script, encoding="utf-8")
          print(f"Se encontraron {len(parser.scripts)} bloques JavaScript.")
          PY
          for script in /tmp/klk-inline-*.js; do
            node --check "$script"
          done
          node --check calls.js

      - name: Generar proyecto Android
        run: npx cap add android

      - name: Configurar Firebase y Google Services para Android
        run: |
          set -e
          test -s google-services.json
          cp google-services.json android/app/google-services.json
          python3 - <<'PY'
          from pathlib import Path
          root = Path("android/build.gradle")
          app = Path("android/app/build.gradle")
          if not root.exists() or not app.exists():
              raise SystemExit("No se encontraron los archivos Gradle generados por Capacitor.")
          root_text = root.read_text()
          classpath = "classpath 'com.google.gms:google-services:4.4.2'"
          if classpath not in root_text:
              anchor = "dependencies {"
              if anchor not in root_text:
                  raise SystemExit("No se encontró dependencies en android/build.gradle.")
              root_text = root_text.replace(anchor, anchor + chr(10) + "        " + classpath, 1)
              root.write_text(root_text)
          app_text = app.read_text()
          plugin = "apply plugin: 'com.google.gms.google-services'"
          if plugin not in app_text:
              app.write_text(app_text.rstrip() + chr(10) + chr(10) + plugin + chr(10))
          PY

      - name: Instalar herramienta para iconos Android
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Aplicar logo klk a los iconos Android
        run: |
          set -e
          for item in mdpi:108 hdpi:162 xhdpi:216 xxhdpi:324 xxxhdpi:432; do
            density="${item%%:*}"
            size="${item##*:}"
            dir="android/app/src/main/res/mipmap-$density"
            mkdir -p "$dir"
            rsvg-convert -w "$size" -h "$size" icon.svg > "$dir/ic_launcher.png"
            cp "$dir/ic_launcher.png" "$dir/ic_launcher_round.png"
            cp "$dir/ic_launcher.png" "$dir/ic_launcher_foreground.png"
          done

      - name: Declarar permisos de cámara y micrófono
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          marker = '<application'
          permissions = '''    <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
          '''
          if marker not in s:
              raise SystemExit("No se encontró la etiqueta application en AndroidManifest.xml")
          s = s.replace(marker, permissions + marker, 1)
          p.write_text(s)
          PY

      - name: Sincronizar archivos
        run: npx cap sync android

      - name: Compilar APK de prueba
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Verificar APK generado
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk && ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: klk-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
