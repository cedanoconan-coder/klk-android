name: Vendor KLK face tracking assets
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vendor-klk-face.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Download pinned face tracker and model
        run: |
          set -euo pipefail
          mkdir -p klk-face-assets/wasm
          npm install --prefix /tmp/klk-vendor --no-save --ignore-scripts @mediapipe/tasks-vision@0.10.21
          cp /tmp/klk-vendor/node_modules/@mediapipe/tasks-vision/vision_bundle.mjs klk-face-assets/vision_bundle.mjs
          cp /tmp/klk-vendor/node_modules/@mediapipe/tasks-vision/wasm/* klk-face-assets/wasm/
          curl --fail --location --retry 3 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task' -o klk-face-assets/face_landmarker.task
          test -s klk-face-assets/vision_bundle.mjs
          test -s klk-face-assets/face_landmarker.task
      - name: Commit downloaded assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add klk-face-assets
          git diff --cached --quiet || (git commit -m 'Vendor pinned KLK face tracking assets' && git push)
